soulseek:
  username: ${SLSKD_USERNAME}
  password: ${SLSKD_PASSWORD}

directories:
  downloads: /data/downloads
  incomplete: /data/incomplete

web:
  authentication:
    username: admin
    password: ${SLSKD_WEB_PASSWORD}
    api_keys:
      bot:
        key: ${SLSKD_API_KEY}
        role: readwrite
  port: 5030

shares:
  directories:
    - /data/downloads

global:
  download:
    slots: 4
  upload:
    slots: 1
  limits:
    download: 0
    upload: 0
